<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="mirza's website">
<link rel="icon" href="https://salrn.github.io/publicfiles/rs.png" type="image/png">
<title>mirza's website</title>
<style>
:root{
  --frame:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABIAAAASCAYAAABWzo5XAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAERSURBVDhPrdNBagIxGMXxabWlQmkL3RQq9Q4uepPewbUn8A6C6GVn+n4hcTUuhAT+Y8j33psknzPU8VB5DIuwDE83UKOhbb4yWgDBc1iF1/AW3sNHxdyaGg0tTwssDwsvgegzfIXv8BM2FXNrajS0PLwlSKJ0hW3Yh2M4hXO4VMytqdHQ8vDKKOe1VW/ZT9N0GMdxl9+/OWrtQFs9vDLK1iTb8pEw/Ib1DdR2tNXDK6N0wiU6/6m+da0wN9RoMnVMHl4Z5aEjLvN8R5A74+G9BmmvzlzuCNIAHt7+Qd2O1uWyu7W/2x+y2yfS7aP1kGhBuq0SuUQd0V6YW1OjoeXhLUGGSQt0XgKdmEONpgWEYfgHTSjufe+VRvcAAAAASUVORK5CYII=");
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#0f2238;
  color:#fff;
  font:14px/1.45 "Segoe UI",Tahoma,sans-serif;
}
a{color:inherit}

.bg{position:fixed;inset:0;z-index:-1}
.bg iframe{width:100%;height:100%;border:0;pointer-events:none}
.bg::after{content:"";position:absolute;inset:0;background:#0006}

main{
  max-width:860px;
  margin:0 auto;
  padding:9vh 20px 40px;
  display:grid;
  grid-template-columns:1fr 250px;
  gap:22px;
  align-items:start;
}

.win{
  position:relative;
  background:#ffffff1f;
  backdrop-filter:blur(14px);
  border:1px solid #ffffff55;
  box-shadow:0 6px 20px #0007;
}
.win:first-child{z-index:1}
.win::before{
  content:"";
  position:absolute;
  inset:0;
  border:6px solid transparent;
  border-image:var(--frame) 6 fill / 6px / 4px stretch;
  opacity:.45;
  pointer-events:none;
}
.bar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  font-size:13px;
  text-shadow:0 1px 2px #000;
}
.bar img{width:18px;height:18px}
.body{
  margin:0 7px 7px;
  padding:14px 16px;
  background:#0d1a2bcc;
  border:1px solid #ffffff30;
}

.pk{float:right;position:relative}
.logo{
  display:block;
  width:64px;
  cursor:pointer;
  user-select:none;
  -webkit-user-drag:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}
.hint{
  position:absolute;
  left:100%;
  bottom:62%;
  width:112px;
  margin-left:-6px;
  font:12px/1.05 "Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  color:#fff;
  text-shadow:0 1px 3px #000;
  transform:rotate(4deg);
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
}
.hint.on{opacity:1}
.hint svg{
  display:block;
  width:40px;
  margin-top:2px;
  transform:scaleX(-1);
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.hint .t{display:none}
@media (hover:none){
  .hint .m{display:none}
  .hint .t{display:inline}
}

h1{margin:0 0 4px;font-size:26px;font-weight:400}
.sub{margin:0 0 18px;color:#b8c4d2}

.go{margin:0;padding:0;list-style:none;border-top:1px solid #ffffff22}
.go a{
  display:flex;
  gap:12px;
  align-items:center;
  padding:11px 6px;
  border-bottom:1px solid #ffffff22;
  text-decoration:none;
}
.go a:hover{background:#6fb3ff26}
.go svg{width:30px;height:30px;fill:#cfe6ff;flex:none}
.go b{display:block;font-size:17px;font-weight:600}
.go span{color:#b8c4d2}

.socials{margin:16px 0 0;color:#b8c4d2}
.socials a{color:#cfe6ff}
.socials a:hover{color:#fff}

.dc{text-align:center}
.av{position:relative;display:inline-block;margin-bottom:8px;cursor:pointer;user-select:none;touch-action:manipulation}
.av img{-webkit-user-drag:none;-webkit-touch-callout:none}
.av img{width:84px;height:84px;border-radius:50%;display:block;border:2px solid #ffffff44}
.dot{
  position:absolute;
  right:2px;
  bottom:2px;
  width:18px;
  height:18px;
  border-radius:50%;
  border:3px solid #0d1a2b;
  background:#747f8d;
}
.dot.online{background:#23a55a}
.dot.idle{background:#f0b232}
.dot.dnd{background:#f23f43}
.name{font-size:17px;font-weight:600}
.state{color:#b8c4d2;font-size:13px}
.custom{margin-top:8px;font-size:13px;color:#dde6f0}
.custom img{width:16px;height:16px;vertical-align:-3px;margin-right:4px}

.act{
  display:none;
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #ffffff22;
  gap:10px;
  text-align:left;
}
.act.on{display:flex}
.act img{width:52px;height:52px;border-radius:6px;object-fit:cover;flex:none}
.act img[hidden]{display:none}
.act div{min-width:0;font-size:12px;color:#b8c4d2}
.act div *{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act small{display:block;color:#8ea0b4}
.act.spot small{color:#1ed760}
.act strong{display:block;color:#fff;font-size:13px}

.red{background:#ffdce222;border-color:#ffc4cc55}
.red .body{background:#1c1726d4;border-color:#ffc4cc30}
.red .state,.red .act div{color:#c4bccb}
.red .act{border-color:#ffc4cc24}
.red .dot{border-color:#1c1726}

footer{
  grid-column:1 / -1;
  color:#fff9;
  font-size:12px;
  text-shadow:0 1px 2px #000;
}

@media (max-width:700px){
  main{grid-template-columns:1fr;padding-top:24px}
  .hint{left:auto;right:100%;margin:0 -6px 0 0;text-align:right;transform:rotate(-4deg)}
  .hint svg{margin-left:auto;transform:none}
}
</style>
</head>
<body>
<div class="bg"><iframe src="https://gtbsg.tumblr.com/" title="background" tabindex="-1"></iframe></div>

<main>
  <section class="win">
    <div class="bar"><img src="https://salrn.github.io/publicfiles/rs.png" alt="">mirza's website</div>
    <div class="body">
      <span class="pk">
        <img class="logo" src="https://salrn.github.io/publicfiles/funne.png" alt="">
        <span class="hint" aria-hidden="true">
          <span class="m">right click for a different preset</span>
          <span class="t">hold to change preset</span>
          <svg viewBox="0 0 64 34"><path d="M3 5c6 13 22 22 49 18m0 0c-3-3-6-5-10-6m10 6c-4 2-7 5-8 9"/></svg>
        </span>
      </span>
      <h1>mirza</h1>
      <p class="sub">pick where u wanna go</p>

      <ul class="go">
        <li><a href="files.html">
          <svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4.5l2 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></svg>
          <div><b>files</b><span>tools and stuff to download</span></div>
        </a></li>
        <li><a href="portfolio.html">
          <svg viewBox="0 0 24 24"><path d="M9 4a2 2 0 0 0-2 2v1H4.5a2 2 0 0 0-2 2v9.5a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H17V6a2 2 0 0 0-2-2H9zm0 3V6h6v1H9zM4.5 9h15v9.5h-15V9z"/></svg>
          <div><b>portfolio</b><span>things i made</span></div>
        </a></li>
      </ul>

      <p class="socials">
        <a href="https://instagram.com/killmirzaa" target="_blank" rel="noopener" title="follow me on ig :3">instagram</a> ·
        <a href="https://youtube.com/@sutd" target="_blank" rel="noopener">youtube</a> ·
        <a href="https://open.spotify.com/user/6w0zdbvb5zyrbcnnlu6stl2z9" target="_blank" rel="noopener">spotify</a> ·
        <a href="https://soundcloud.com/mirz4" target="_blank" rel="noopener" title="hi">soundcloud</a>
      </p>
    </div>
  </section>

  <aside class="win red">
    <div class="bar">discord</div>
    <div class="body dc">
      <div class="av">
        <img id="av" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="">
        <span class="dot" id="dot"></span>
      </div>
      <div class="name" id="name">mirza</div>
      <div class="state" id="state">offline</div>
      <div class="custom" id="custom" hidden></div>

      <div class="act" id="act">
        <img id="actImg" alt="" hidden>
        <div>
          <small id="actHead"></small>
          <strong id="actName"></strong>
          <p id="actLine1"></p>
          <p id="actLine2"></p>
        </div>
      </div>
    </div>
  </aside>

  <footer>ctrl+f5 if stuff doesnt update</footer>
</main>

<script>
const uid = '708693430523658322';
const $ = id => document.getElementById(id);
const labels = { online: 'online', idle: 'idle', dnd: 'do not disturb', offline: 'offline' };

function assetUrl(a) {
  const img = a.assets && a.assets.large_image;
  if (!img) return '';
  if (img.startsWith('mp:')) return 'https://media.discordapp.net/' + img.slice(3);
  if (img.startsWith('http')) return img;
  return `https://cdn.discordapp.com/app-assets/${a.application_id}/${img}.png`;
}

function showAct(head, name, l1, l2, img, spot) {
  $('act').className = 'act on' + (spot ? ' spot' : '');
  $('actHead').textContent = head;
  $('actName').textContent = name;
  $('actLine1').textContent = l1 || '';
  $('actLine2').textContent = l2 || '';
  $('actImg').hidden = !img;
  if (img) $('actImg').src = img;
}

async function update() {
  try {
    const res = await fetch('https://api.lanyard.rest/v1/users/' + uid);
    const { success, data } = await res.json();
    if (!success) { $('state').textContent = 'status not available'; return; }

    const u = data.discord_user;
    $('av').src = `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=256`;
    $('name').textContent = u.display_name || u.username;
    $('dot').className = 'dot ' + data.discord_status;
    $('state').textContent = labels[data.discord_status] || data.discord_status;

    const cs = data.activities.find(a => a.type === 4);
    $('custom').hidden = !(cs && cs.state);
    if (cs && cs.state) {
      $('custom').textContent = cs.state;
      if (cs.emoji) {
        if (cs.emoji.id) {
          const e = document.createElement('img');
          e.src = `https://cdn.discordapp.com/emojis/${cs.emoji.id}.${cs.emoji.animated ? 'gif' : 'png'}`;
          e.alt = '';
          $('custom').prepend(e);
        } else {
          $('custom').prepend(cs.emoji.name + ' ');
        }
      }
    }

    const s = data.spotify;
    const game = data.activities.find(a => a.type === 0);
    if (s && s.track_id) {
      showAct('listening to spotify', s.song, s.artist && 'by ' + s.artist, s.album && 'on ' + s.album, s.album_art_url, true);
    } else if (game) {
      showAct('playing', game.name, game.details, game.state, assetUrl(game), false);
    } else {
      $('act').className = 'act';
    }
  } catch {
    $('state').textContent = 'couldnt load status';
  }
}

const presets = [
  {
    d: .35, s: 18,
    press: k => { k.sx.t = k.sy.t = .8; },
    release: k => {
      k.sx.v += 9; k.sy.v += 9;
      k.rot.v += (Math.random() < .5 ? -1 : 1) * (500 + Math.random() * 400);
    }
  },
  {
    d: .12, s: 22,
    press: k => { k.sx.t = 1.25; k.sy.t = .7; },
    release: k => { k.sx.v -= 10; k.sy.v += 10; }
  },
  {
    d: .4, s: 13,
    press: k => { k.sx.t = 1.12; k.sy.t = .82; },
    release: k => {
      k.y.v -= 950;
      k.sy.v += 6;
      k.rot.v += (Math.random() - .5) * 400;
    }
  },
  {
    d: .45, s: 10,
    press: k => { k.sx.t = k.sy.t = .9; },
    release: k => { k.rot.t += Math.random() < .5 ? -360 : 360; }
  }
];

const spr = p => ({ p, v: 0, t: p, d: 0, s: 0 });

function step(sp, dt) {
  sp.v += (sp.s * sp.s * (sp.t - sp.p) - 2 * sp.d * sp.s * sp.v) * dt;
  sp.p += sp.v * dt;
  return Math.abs(sp.t - sp.p) + Math.abs(sp.v) > .001;
}

function springy(el, hover, start = 0) {
  const k = { sx: spr(1), sy: spr(1), rot: spr(0), y: spr(0) };
  const all = Object.values(k);
  let cur = 0, raf = 0, last = 0, over = false;

  const use = i => {
    cur = i;
    all.forEach(sp => { sp.d = presets[i].d; sp.s = presets[i].s; });
    k.rot.p %= 360;
    k.rot.t %= 360;
  };

  const tick = now => {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    let moving = false;
    for (const sp of all) moving = step(sp, dt) || moving;
    el.style.transform = `translateY(${k.y.p}px) rotate(${k.rot.p}deg) scale(${k.sx.p},${k.sy.p})`;
    raf = moving ? requestAnimationFrame(tick) : 0;
  };

  const wake = () => {
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
  };

  const rest = () => { k.sx.t = k.sy.t = over ? hover : 1; };

  const play = () => { rest(); presets[cur].release(k); wake(); };

  let hold = 0, held = false, touch = false;
  const next = () => { use((cur + 1) % presets.length); play(); };
  const cancel = () => { clearTimeout(hold); over = false; rest(); wake(); };

  el.onpointerenter = () => { over = true; rest(); wake(); };
  el.onpointerleave = cancel;
  el.onpointercancel = cancel;
  el.onpointerdown = e => {
    touch = e.pointerType !== 'mouse';
    if (e.button !== 0) return;
    held = false;
    presets[cur].press(k);
    wake();
    if (touch) hold = setTimeout(() => { held = true; next(); }, 450);
  };
  el.onpointerup = e => {
    if (e.button !== 0) return;
    clearTimeout(hold);
    if (!held) play();
  };
  el.oncontextmenu = e => {
    e.preventDefault();
    if (!touch) next();
  };

  use(start);
}

springy(document.querySelector('.logo'), 1.08);
springy(document.querySelector('.av'), 1.05, 2);

const hint = document.querySelector('.hint');
let hinted = false;
const showHint = () => {
  if (hinted) return;
  hinted = true;
  hint.classList.add('on');
  setTimeout(() => hint.classList.remove('on'), 4000);
};
if (matchMedia('(hover:none)').matches) showHint();
else document.querySelector('.pk').addEventListener('pointerenter', showHint);

$('actImg').onerror = () => { $('actImg').hidden = true; };
update();
setInterval(update, 30000);
</script>
</body>
