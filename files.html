<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="mirza's files, tools and downloads">
<link rel="icon" href="https://salrn.github.io/publicfiles/rs.png" type="image/png">
<title>mirza's file browser</title>
<style>
:root{
  --frame:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABIAAAASCAYAAABWzo5XAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAERSURBVDhPrdNBagIxGMXxabWlQmkL3RQq9Q4uepPewbUn8A6C6GVn+n4hcTUuhAT+Y8j33psknzPU8VB5DIuwDE83UKOhbb4yWgDBc1iF1/AW3sNHxdyaGg0tTwssDwsvgegzfIXv8BM2FXNrajS0PLwlSKJ0hW3Yh2M4hXO4VMytqdHQ8vDKKOe1VW/ZT9N0GMdxl9+/OWrtQFs9vDLK1iTb8pEw/Ib1DdR2tNXDK6N0wiU6/6m+da0wN9RoMnVMHl4Z5aEjLvN8R5A74+G9BmmvzlzuCNIAHt7+Qd2O1uWyu7W/2x+y2yfS7aP1kGhBuq0SuUQd0V6YW1OjoeXhLUGGSQt0XgKdmEONpgWEYfgHTSjufe+VRvcAAAAASUVORK5CYII=");
}
.win::before{content:"";position:absolute;inset:0;border:6px solid transparent;border-image:var(--frame) 6 fill / 6px / 4px stretch;opacity:.45;pointer-events:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0f2238;color:#fff;font:14px/1.45 "Segoe UI",Tahoma,sans-serif}
a{color:#cfe6ff}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}
button{color:inherit;cursor:pointer}button:disabled{cursor:wait;opacity:.6}
:focus-visible{outline:2px solid #b5dcff;outline-offset:3px}
main{max-width:1060px;margin:auto;padding:6vh 20px 30px}
.win{position:relative;background:#ffffff1f;border:1px solid #ffffff55;box-shadow:0 6px 20px #0007,inset 0 0 0 3px #ffffff0c}
.bar{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:13px;text-shadow:0 1px 2px #000}
.bar img{width:18px;height:18px}.bar a{margin-left:auto;font-size:12px}
.body{margin:0 7px 7px;padding:18px;background:#0d1a2bcc;border:1px solid #ffffff30}
h1{margin:0;font-size:26px;font-weight:400}.sub{margin:3px 0 18px;color:#b8c4d2}
.heading{display:flex;align-items:center;justify-content:space-between;gap:20px}.heading img{width:48px;height:48px;object-fit:contain}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));grid-auto-flow:row;gap:6px;margin-bottom:18px}
.tab{min-height:64px;padding:10px 12px;text-align:left;background:#ffffff08;border:1px solid #ffffff25;overflow-wrap:anywhere}
.tab:first-child{grid-column:span 2;background:#8abff012}.tab span{display:block;font-size:11px;color:#a9bacb;margin-top:3px}
.tab:hover{background:#6fb3ff26}.tab[aria-pressed="true"]{background:#6fb3ff30;border-color:#9ecbfa;box-shadow:inset 3px 0 #cfe6ff}
.tab.protected{background:#ffdce20c;border-color:#ffc4cc35}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid #ffffff22}
.toolbar h2{margin:0;font-size:16px;font-weight:600}.count{font-size:12px;color:#b8c4d2;margin-top:2px}
.search{display:flex;align-items:center;gap:8px;color:#b8c4d2;font-size:12px}
input{min-width:0;width:245px;background:#081525;color:#fff;border:1px solid #ffffff40;padding:8px 10px;border-radius:0}input::placeholder{color:#93a5ba}
.viewport{height:65vh;min-height:320px;max-height:820px;overflow:auto;overscroll-behavior:contain;scrollbar-color:#536d87 #0b1929;scrollbar-gutter:stable;position:relative;border-top:1px solid #ffffff22;border-bottom:1px solid #ffffff22;overflow-anchor:none}
.mosaic{position:relative;width:100%}
.card{position:absolute;display:flex;flex-direction:column;overflow:hidden;background:#14263a;border:1px solid #ffffff28;padding:12px;contain:layout paint}
.card:hover{border-color:#94b9dc}.preview{display:block;height:128px;flex:none;background:#0b1929;margin:-12px -12px 10px;text-align:center}
.preview img{display:block;width:100%;height:128px;object-fit:contain;color:#a9bacb;font-size:12px}
.category{color:#95aec6;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.card h3{margin:0 0 7px;font-size:16px;font-weight:600;color:#e1efff;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.card p{margin:0 0 12px;color:#b8c4d2;font-size:13px;line-height:19px;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.actions{margin-top:auto;display:flex;gap:6px}.btn{padding:6px 10px;border:1px solid #ffffff35;background:#ffffff0b;color:#cfe6ff;text-decoration:none;text-align:center;font-size:12px}.btn:hover{background:#6fb3ff26;border-color:#94b9dc}.actions .btn:first-child{flex:1}
.notice{padding:18px 0;color:#b8c4d2}.error{color:#ffd0d5}.notice[hidden]{display:none}
.footnote{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:12px;color:#a6b8cb}
footer{margin-top:16px;font-size:12px;color:#fff9}
dialog{width:min(500px,calc(100% - 32px));max-height:80vh;overflow:auto;background:#14263a;border:1px solid #ffffff55;color:#fff;padding:0;box-shadow:0 10px 40px #0009}
dialog::backdrop{background:#0009}dialog .body{padding:18px}dialog h2{font-size:18px;font-weight:400;margin:0 0 12px}dialog p{white-space:pre-wrap;overflow-wrap:anywhere;color:#c3cfdd}dialog input{width:100%;margin-bottom:12px}.dialog-actions{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:600px){main{padding:20px 10px}.body{padding:12px}.toolbar{align-items:stretch;flex-direction:column;gap:10px}.search input{width:100%}.search{width:100%}.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.tab{min-height:58px}.viewport{height:62vh}.footnote{flex-wrap:wrap}}
</style>
</head>
<body>
<main>
  <section class="win">
    <div class="bar"><img src="https://salrn.github.io/publicfiles/rs.png" alt="">mirza's website / files<a href="index.html">← home</a></div>
    <div class="body">
      <div class="heading"><div><h1>files</h1><p class="sub">tools and stuff to download</p></div><img src="https://salrn.github.io/publicfiles/funne.png" alt=""></div>
      <nav class="tabs" aria-label="File categories"></nav>
      <div class="toolbar"><div><h2 id="section-title">All Downloads</h2><div class="count" id="count" aria-live="polite">Loading files…</div></div><label class="search">Search<input id="search" type="search" placeholder="Search in current tab…" autocomplete="off"></label></div>
      <div id="error" class="notice error" role="alert" hidden></div>
      <div id="message" class="notice" role="status" hidden></div>
      <div class="viewport" tabindex="0" aria-label="Files; scroll to browse"><div class="mosaic" role="list" aria-label="Downloads"></div></div>
      <div class="footnote"><span>pick a file, or open its guide</span><a href="https://buymeacoffee.com/m1rza" target="_blank" rel="noopener">buy me a coffee</a></div>
    </div>
  </section>
  <footer>ctrl+f5 if stuff doesnt update</footer>
</main>
<dialog id="guide-dialog" aria-labelledby="guide-title"><div class="bar">file guide</div><div class="body"><h2 id="guide-title"></h2><p id="guide-text"></p><form method="dialog" class="dialog-actions"><button class="btn">Close</button></form></div></dialog>
<dialog id="auth-dialog" aria-labelledby="auth-title"><div class="bar">protected section</div><form class="body" id="auth-form"><h2 id="auth-title">VST and DAWs</h2><p>Enter your access code to view this section.</p><label for="access-code">Access code</label><input id="access-code" type="password" autocomplete="off" maxlength="20" required><p id="auth-error" class="error" role="alert" hidden>Invalid code. Please try again.</p><div class="dialog-actions"><button class="btn" type="button" id="cancel-auth">Cancel</button><button class="btn" type="submit">Unlock</button></div></form></dialog>
<script>
'use strict';
const $ = id => document.getElementById(id);
const viewport = document.querySelector('.viewport');
const mosaic = document.querySelector('.mosaic');
const tabsElement = document.querySelector('.tabs');
const invalidMsg = 'invalid json file providen, mirza is stupid';
const gap = 10;
let tabs = [], allItems = [], protectedItems = null, filtered = [], columns = [];
let active = 'all', unlocked = false, randomTitle = 'All Downloads', frame = 0, searchTimer;
let protectedLoading = false, protectedError = '';
const mounted = new Map();
class InvalidJSON extends Error { constructor(detail) { super(invalidMsg); if (detail) console.error('json problem:', detail); } }
function safeURL(value) {
  if (typeof value !== 'string' || !value.trim()) return '';
  try { const url = new URL(value, document.baseURI); return ['http:', 'https:'].includes(url.protocol) ? url.href : ''; } catch { return ''; }
}
function validateItems(items) {
  if (!Array.isArray(items)) throw new InvalidJSON('items is not an array');
  for (const item of items) {
    if (!item || typeof item !== 'object' || typeof item.name !== 'string' || !item.name.trim() || !safeURL(item.download)) throw new InvalidJSON(item);
    for (const key of ['image','description','guide']) if (item[key] !== undefined && typeof item[key] !== 'string') throw new InvalidJSON(item);
    if (item.image && !safeURL(item.image)) throw new InvalidJSON(item);
  }
  return items;
}
async function readJSON(path) {
  let response;
  try { response = await fetch(path, {cache:'no-cache'}); } catch { throw new Error('Could not reach ' + path + '. Open the page over http(s), not file://.'); }
  if (!response.ok) throw new Error('Could not load ' + path + ' (HTTP ' + response.status + ').');
  try { return await response.json(); } catch { throw new InvalidJSON(path + ' is not valid JSON'); }
}
function showError(error) { $('error').textContent = error instanceof InvalidJSON ? invalidMsg : error.message || 'Could not load files. Please try again.'; $('error').hidden = false; }
function records(items, category, prefix) { return items.map((item,index) => ({...item, category, id:prefix + index, search:item.name.toLowerCase()})); }
function createTabs() {
  const entries = [{id:'all',name:'All',count:allItems.length}, ...tabs.map((tab,index) => ({id:String(index),name:tab.name,count:tab.items.length})), {id:'protected',name:'VST and DAWs',count:'access code required'}];
  for (const entry of entries) {
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'tab' + (entry.id === 'protected' ? ' protected' : ''); button.dataset.section = entry.id;
    button.setAttribute('aria-pressed', String(entry.id === active));
    button.append(document.createTextNode(entry.name));
    const count = document.createElement('span'); count.textContent = typeof entry.count === 'number' ? entry.count + ' files' : entry.count; button.append(count);
    tabsElement.append(button);
  }
}
function selectSection(id) {
  if (id === 'protected' && !unlocked) { $('auth-error').hidden = true; $('auth-dialog').showModal(); return; }
  active = id;
  for (const button of tabsElement.children) button.setAttribute('aria-pressed', String(button.dataset.section === id));
  $('section-title').textContent = id === 'all' ? randomTitle : id === 'protected' ? 'VST and DAWs' : tabs[Number(id)].name;
  applyFilter();
  if (id === 'protected' && protectedItems === null && !protectedLoading) loadProtected();
}
function applyFilter() {
  const source = active === 'all' ? allItems : active === 'protected' ? protectedItems || [] : tabs[Number(active)].items;
  const query = $('search').value.trim().toLowerCase();
  filtered = query ? source.filter(item => item.search.includes(query)) : source;
  $('count').textContent = filtered.length + (filtered.length === 1 ? ' file' : ' files') + (query ? ' found' : '');
  $('message').textContent = active === 'protected' && protectedLoading ? 'Loading files…' : active === 'protected' && protectedError ? protectedError : query ? 'No files match your search.' : 'No files here yet.';
  $('message').hidden = filtered.length > 0;
  viewport.scrollTop = 0;
  mosaic.replaceChildren(); mounted.clear(); layout();
}
function layout() {
  const width = mosaic.clientWidth;
  const number = Math.max(1, Math.floor((width + gap) / 230));
  const cardWidth = (width - gap * (number - 1)) / number;
  columns = Array.from({length:number}, () => []);
  const bottoms = Array(number).fill(gap);
  for (const item of filtered) {
    const column = bottoms.indexOf(Math.min(...bottoms));
    const lines = Math.min(5, Math.max(2, Math.ceil((item.description || '').length / Math.max(20, Math.floor((cardWidth - 24) / 7)))));
    const height = 132 + lines * 19 + (item.image ? 138 : 0);
    const cell = {item,top:bottoms[column],height,width:cardWidth,left:column * (cardWidth + gap),lines};
    columns[column].push(cell); bottoms[column] += height + gap;
  }
  mosaic.style.height = Math.max(...bottoms) + 'px';
  render();
}
function createCard(item) {
  const card = document.createElement('article'); card.className = 'card'; card.setAttribute('role','listitem');
  if (item.image) {
    const link = document.createElement('a'); link.className = 'preview'; link.href = safeURL(item.image); link.target = '_blank'; link.rel = 'noopener'; link.setAttribute('aria-label','View image for ' + item.name);
    const img = document.createElement('img'); img.alt = item.name; img.loading = 'lazy'; img.decoding = 'async'; img.src = safeURL(item.image); link.append(img); card.append(link);
  }
  const category = document.createElement('div'); category.className = 'category'; category.textContent = item.category;
  const title = document.createElement('h3'); title.textContent = item.name; title.title = item.name;
  const description = document.createElement('p'); description.textContent = item.description || ''; description.title = item.description || '';
  const actions = document.createElement('div'); actions.className = 'actions';
  const download = document.createElement('a'); download.className = 'btn'; download.textContent = 'Download'; download.href = safeURL(item.download); download.setAttribute('download','');
  const guide = document.createElement('button'); guide.className = 'btn'; guide.textContent = 'Guide'; guide.addEventListener('click',() => { $('guide-title').textContent = item.name; $('guide-text').textContent = item.guide || 'No guide provided for this file.'; $('guide-dialog').showModal(); });
  actions.append(download,guide); card.append(category,title,description,actions); return card;
}
function render() {
  const top = Math.max(0,viewport.scrollTop - 220), bottom = viewport.scrollTop + viewport.clientHeight + 220;
  const visible = new Set();
  for (const column of columns) {
    let lo = 0, hi = column.length;
    while (lo < hi) { const mid = (lo + hi) >>> 1; if (column[mid].top + column[mid].height < top) lo = mid + 1; else hi = mid; }
    for (let i = lo; i < column.length && column[i].top < bottom; i++) {
      const cell = column[i]; visible.add(cell.item.id);
      let card = mounted.get(cell.item.id);
      if (!card) { card = createCard(cell.item); mounted.set(cell.item.id,card); mosaic.append(card); }
      Object.assign(card.style,{top:cell.top+'px',left:cell.left+'px',width:cell.width+'px',height:cell.height+'px'});
      card.querySelector('p').style.webkitLineClamp = String(cell.lines);
    }
  }
  for (const [id,card] of mounted) if (!visible.has(id) && !card.contains(document.activeElement)) { card.remove(); mounted.delete(id); }
  const ordered = [...mounted.values()].sort((a,b) => parseFloat(a.style.top)-parseFloat(b.style.top) || parseFloat(a.style.left)-parseFloat(b.style.left));
  for (let i=0; i<ordered.length; i++) if (mosaic.children[i] !== ordered[i]) mosaic.insertBefore(ordered[i],mosaic.children[i] || null);
}
function scheduleRender() { if (!frame) frame = requestAnimationFrame(() => { frame = 0; render(); }); }
viewport.addEventListener('scroll',scheduleRender,{passive:true});
viewport.addEventListener('focusout',scheduleRender);
new ResizeObserver(layout).observe(mosaic);
tabsElement.addEventListener('click',event => { const button = event.target.closest('button[data-section]'); if (button) selectSection(button.dataset.section); });
$('search').addEventListener('input',() => { clearTimeout(searchTimer); searchTimer = setTimeout(applyFilter,100); });
$('cancel-auth').addEventListener('click',() => $('auth-dialog').close());
$('auth-dialog').addEventListener('close',() => { $('access-code').value = ''; });
$('auth-form').addEventListener('submit',event => {
  event.preventDefault();
  if ($('access-code').value.trim() !== 'demo123') { $('auth-error').hidden = false; $('access-code').value = ''; return; }
  unlocked = true; $('auth-dialog').close();
  tabsElement.querySelector('[data-section="protected"] span').textContent = 'unlocked'; selectSection('protected');
});
async function loadProtected() {
  protectedLoading = true; protectedError = ''; applyFilter();
  try {
    let data = await readJSON('protected-info.json');
    if (data && Object.hasOwn(data,'encrypted')) {
      try {
        if (typeof data.encrypted !== 'string') throw new InvalidJSON('encrypted is not a string');
        const bytes = Uint8Array.from(atob(data.encrypted),char => char.charCodeAt(0));
        const decoded = new TextDecoder('utf-8',{fatal:true}).decode(bytes);
        const key = 'HMIF4HI66QCJRDTIEBBJQHCU45TOWIKQ';
        let plain = ''; for (let i=0;i<decoded.length;i++) plain += String.fromCharCode(decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        data = JSON.parse(plain);
      } catch(error) { throw error instanceof InvalidJSON ? error : new InvalidJSON('could not decrypt protected-info.json'); }
    }
    protectedItems = records(validateItems(data?.items),'VST and DAWs','p');
  } catch(error) { protectedError = error instanceof InvalidJSON ? invalidMsg : error.message || 'Could not load protected files.'; }
  finally { protectedLoading = false; if (active === 'protected') applyFilter(); }
}
async function init() {
  try {
    const data = await readJSON('info.json');
    if (!data || !Array.isArray(data.tabs)) throw new InvalidJSON('info.json needs a "tabs" array');
    tabs = data.tabs.map((tab,index) => {
      if (!tab || typeof tab.name !== 'string' || !tab.name.trim()) throw new InvalidJSON(tab);
      return {name:tab.name,items:records(validateItems(tab.items),tab.name,'t'+index+'-')};
    });
    allItems = tabs.flatMap(tab => tab.items); createTabs(); applyFilter();
  } catch(error) { console.error(error); showError(error); $('count').textContent = 'Files unavailable'; $('search').disabled = true; return; }
  try {
    const response = await fetch('titles.json',{cache:'no-cache'}); if (!response.ok) return;
    let data; try { data = await response.json(); } catch { throw new InvalidJSON('titles.json is not valid JSON'); }
    if (!data || !Array.isArray(data.titles) || !data.titles.length || !data.titles.every(title => typeof title === 'string' && title.trim())) throw new InvalidJSON('titles.json needs a non-empty "titles" array of strings');
    randomTitle = data.titles[Math.floor(Math.random()*data.titles.length)]; if (active === 'all') $('section-title').textContent = randomTitle;
  } catch(error) { if (error instanceof InvalidJSON) showError(error); }
}
init();
</script>
</body>
</html>
